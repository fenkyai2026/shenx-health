name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Jenis build"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

jobs:
  build:
    name: Build SHENX HEALTH APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Siapkan keystore debug tetap (sekali generate, lalu dipakai selamanya)
        run: |
          KS="android/app/debug-ci.keystore"
          if [ -f "$KS" ]; then
            echo "Keystore debug tetap sudah ada, dipakai."
            exit 0
          fi
          keytool -genkeypair -v -keystore "$KS" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Shenx Health,OU=Dev,O=Shenx,L=Unknown,S=Unknown,C=ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$KS"
          git commit -m "Tambah keystore debug tetap untuk build APK konsisten [skip ci]"
          git push

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets ke project Android
        run: npx cap sync android

      - name: Siapkan keystore (kalau secret tersedia)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHENX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/shenx-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pastikan gradlew bisa dieksekusi
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          SHENX_KEYSTORE_PASSWORD: ${{ secrets.SHENX_KEYSTORE_PASSWORD }}
          SHENX_KEY_ALIAS: ${{ secrets.SHENX_KEY_ALIAS }}
          SHENX_KEY_PASSWORD: ${{ secrets.SHENX_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ] && [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" -exec cp {} out/ \;
          cd out && for f in *.apk; do mv "$f" "shenx-health-1.0.${{ github.run_number }}-${f%.apk}.apk"; done
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shenx-health-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Buat GitHub Release (untuk auto-update di app)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" \
            --title "SHENX HEALTH v1.0.${{ github.run_number }}" \
            --notes "Build otomatis dari commit ${{ github.sha }}"
